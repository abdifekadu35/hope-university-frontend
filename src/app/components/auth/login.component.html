<div class="container">
  <!-- LEFT SIDE -->
  <div class="left">
    <div class="left-content">
      <div class="icon">🎓</div>
      <h2>
        Welcome to<br>
        Hope University<br>
        Management System
      </h2>
      <p>Complete university management solution for administrators, teachers, students, and parents.</p>
      <div class="illustration">
        <div class="placeholder-icon">📚</div>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div class="form-box">
      <h1>LOGIN</h1>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Email Address"
        autocomplete="email"
      />

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Password"
        autocomplete="current-password"
        (keyup.enter)="onSubmit()"
      />

      <button (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'LOGGING IN...' : 'LOGIN' }}
      </button>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <a href="#">Forgot Password?</a>
    </div>
  </div>
</div>
